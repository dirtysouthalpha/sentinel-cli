name: CI

# Type-check, test, and build on every push to main and on PRs.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # npm install (not ci) so a lockfile authored on another platform still
      # resolves — npm reconciles optional/transitive deps per-OS.
      - run: npm install --no-audit --no-fund

      - name: Type-check
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build (CLI + GUI)
        run: npm run build
